name: Refresh daily data

on:
  schedule:
    # Daily at 00:30 IST (19:00 UTC previous day)
    - cron: "30 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh FII/DII cash flows (NSE)
        run: python data/refresh_fii_dii.py
        continue-on-error: true

      - name: Refresh mutual-fund sector flows (AMFI)
        run: python data/refresh_mf_amfi.py
        continue-on-error: true

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore(data): daily refresh of FII/DII and MF flow snapshots"
            git push
          fi